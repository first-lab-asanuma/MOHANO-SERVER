[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mohano-server"
version = "0.1.0"
description = "MOHANO REST API server"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "alembic>=1.14,<2.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "google-auth[requests]>=2.35,<3.0",
  "boto3>=1.35,<2.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
